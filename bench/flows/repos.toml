notes = "route: (a) API v2 (Huma): cada `Register(api, huma.Operation{..}, handler)` de los 20 ficheros pkg/routes/api/v2 del scope (projects, project_duplicate, tasks, task_collection, task_duplicate, task_unread_status, task_assignees, task_relations, task_position, task_bucket, task_bulk_create, buckets, labels, label_tasks, label_task_bulk, webhooks, user_webhooks, webhook_events, notifications, notifications_feed) -> `func handler(` del mismo fichero; from = linea de `Register(`; detail con prefijo /api/v2 (apiv2.GroupPrefix). (b) API v1 (echo): `a.VERBO(path, handler)` de registerAPIRoutes en routes.go solo para los recursos projects, tasks (taskHandler y taskCollectionHandler), labels, label_tasks (+bulk), notifications (+ MarkAllNotificationsAsRead) y webhooks (+ GetAvailableWebhookEvents) -> como el handler es el generico handler.WebHandler{EmptyStruct: models.X}.CreateWeb/ReadAllWeb/ReadOneWeb/UpdateWeb/DeleteWeb, `to` apunta al metodo del modelo (Create/ReadAll/ReadOne/Update/Delete, symbol Modelo.Metodo, ver note); detail con /api/v1 y parametros `:param`. Omitido: el resto de v1/v2 (users, auth, admin, teams, shares, comments, attachments, project views, saved filters, reactions, sessions, tokens, migrations, bots, time entries, caldav/feeds, ws, docs), bulk_task.go y task_assignees_bulk.go de v2, las rutas v1 de buckets/duplicate/read/position/bulk/assignees/relations/bucket-task, y los PATCH que genera Huma AutoPatch en tiempo de arranque (no hay declaracion estatica). http: el frontend es Vue 3/TS pero NO usa AbstractService/axios: llama al cliente OpenAPI generado (@tanstack/vue-query + @/client/generated, baseUrl '/api/v2', sdk.gen.ts). Se etiqueta cada llamada `sdkFn(...)` en los 8 ficheros frontend/src/client/queries del scope (projects, tasks, taskMutations, kanban, kanbanMutations, labels, webhooks, notifications) -> handler Huma v2 de esa operacion (nota `via generated SDK client`); el mapa nombreSDK->ruta sale del OperationID de cada Register. No se etiquetan las URLs dentro de sdk.gen.ts (codigo generado). Omitidas por dinamicas/sin declaracion estatica: patchProjectsRead y patchTasksRead (PATCH de AutoPatch). Las llamadas a v1 no existen en el frontend. event: bus watermill (gochannel). Eventos del scope: TaskCreatedEvent, TasksBatchCreatedEvent, TaskUpdatedEvent, TaskDeletedEvent, NotificationCreatedEvent y WebhookDeliveryEvent. Productor = linea de events.DispatchOnCommit/Dispatch (tasks.go, kanban_task_bucket.go, task_assignees.go, notifications/database.go AfterInsert, WebhookListener.Handle) -> `Handle` de cada consumidor: listeners propios de models/listeners.go (RegisterListener), WebhookListener.Handle (RegisterEventForWebhook, solo con webhooks.enabled), auditListener.Handle (RegisterEventForAudit, solo con audit.enabled; el listener es un closure generico y `to` apunta a su Handle) y NotificationListener.Handle del websocket. Mas una etiqueta por registro de suscripcion (nota `subscription registration`) -> Handle. Exhaustivo para los productores de esos 6 eventos en todo pkg/ (verificado por script). Omitidos: resto de eventos (comentarios, adjuntos, relaciones, proyectos, equipos, admin, sesiones, time entries, login), los productores dinamicos de plugins, y los cron (cron.Schedule) que no son eventos. data: (1) modelo ORM (Label, LabelTask, Webhook, DatabaseNotification) -> entrada `&Modelo{}` de GetTables (schema que sincroniza migration.initSchema) y, para webhooks y notifications, -> struct de la migracion que crea la tabla (20230913202615, 20210207192805); labels y label_tasks no tienen migracion de creacion (vienen del esquema inicial). (2) Cada sentencia xorm (Insert/Get/Exist/Find/Count/Update/Delete, incluidos los s.Table(\"labels\") con join a label_tasks, etiquetados contra Label y LabelTask) de label.go, label_task.go, webhooks.go, notifications/database.go y notifications/notification.go -> struct del modelo. Exhaustivo solo en esos 5 ficheros (tasks.go, listeners.go, etc. estan en scope unicamente para event). Omitidas las migraciones que alteran columnas y el resto de tablas. env: lecturas `config.X.GetBool/GetInt/GetString` (viper, VIKUNJA_<CLAVE_CON_GUION_BAJO> via SetEnvPrefix+AutomaticEnv) de las claves Webhooks* , ServiceRootpath y DatabasePath en todo pkg/ no-test -> const `Key` en pkg/config/config.go; y esas dos ultimas claves -> `ENV VIKUNJA_SERVICE_ROOTPATH/VIKUNJA_DATABASE_PATH` del Dockerfile. Frontend: lecturas env.SENTRY_*, env.VIKUNJA_FRONTEND_BASE, env.DEV_PROXY de vite.config.ts e import.meta.env.VITE_IS_ONLINE de useOnline.ts -> linea comentada de frontend/.env.local.example. Omitidas: VIKUNJA_FRONTEND_PORT y VUE_DEVTOOLS_LAUNCH_EDITOR (no definidas en ningun fichero), VIKUNJA_OPENAPI_INPUT, el resto de claves de config, os.Getenv de magefile/tests y config-raw.json (documentacion/generador de config.yml.sample, que no esta en el repo). No hay docker-compose en el repo. service: Dockerfile multi-stage (COPY --from=frontendbuilder/apibuilder -> etapa FROM ... AS, dist del SPA -> go:embed de frontend/embed.go, ENTRYPOINT -> COPY del binario) y empaquetado nfpm.yaml (vikunja.service, vikunja.initd, scripts postinstall/postupgrade, symlink de ExecStart). Sin depends_on ni k8s. rpc: no hay gRPC."


