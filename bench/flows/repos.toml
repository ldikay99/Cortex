# Dataset de verdad-terreno de flujos entre componentes (ver README.md).
# Los repos se clonan en ~/.cache/cortex-bench/flows/<name> y se fijan al SHA indicado
# (HEAD de la rama por defecto en el momento del etiquetado; "ref" es el tag mas cercano, informativo).
# `scope` = rutas exhaustivamente etiquetadas; `kinds` = tipos de flujo etiquetados de forma exhaustiva
# dentro de ese scope. Fuera de scope/kinds NO hay garantia de exhaustividad (no calcular recall alli).

[[repo]]
name = "microservices-demo"
stack = "Go + C# + Node.js + Python + Java; gRPC entre servicios, frontend Go con templates HTML/JS, k8s"
url = "https://github.com/GoogleCloudPlatform/microservices-demo"
commit = "38e7348eb289eb5b87c0c6e8cb19ced0449dc389"
ref = "main (tag cercano: sic-jss)"
scope = ["src/", "kubernetes-manifests/"]
kinds = ["rpc", "http", "route", "env", "service"]
notes = "env: solo las variables con definicion en kubernetes-manifests; no se etiqueto data (Redis/AlloyDB sin esquema en repo)."

