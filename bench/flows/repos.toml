dispatcher.dispatch(CONSTANTE) de message.rb (MESSAGE_CREATED), conversation.rb (CONVERSATION_CREATED), contact.rb (CONTACT_CREATED), inbox.rb (INBOX_UPDATED, primera), notification.rb (NOTIFICATION_CREATED), account.rb (ACCOUNT_CREATED) y campaign.rb (ACCOUNT_CACHE_INVALIDATED) -> cada metodo `def nombre_del_evento(event)` de los listeners registrados (el nombre del metodo es el evento con . -> _, via Events::Base#method_name y Wisper). Un label por consumidor. Fuera de scope: el resto de dispatch/perform_later (concerns, servicios, lib, enterprise, controllers no listados), jobs de enterprise y CaptainListener. data: modelo (Label, Team, TeamMember, CannedResponse, Webhook, CustomFilter, Macro, AutomationRule, Campaign, AgentBot, User, AccountUser) -> create_table de db/schema.rb (nota model -> schema), y la primera consulta por asociacion o clase (Current.account.labels, AgentBot.accessible_to, Macro.with_visibility, etc.) en los controladores de esos recursos -> clase del modelo (nota model usage). Sin migraciones. env: lectura ENV[..]/ENV.fetch (primera ocurrencia por variable) en config/initializers/mailer.rb, config/cable.yml, config/database.yml, config/secrets.yml, config/schedule.yml, lib/redis/config.rb y lib/limits.rb de variables definidas en .env.example (tambien comentadas `# VAR=`) -> linea del .env.example. El resto de config/, app/ y lib/ no se etiqueta. service: depends_on de rails y sidekiq en docker-compose.yaml (postgres, redis, vite, mailhog, sidekiq) y docker-compose.production.yaml (postgres, redis), mas VITE_DEV_SERVER_HOST=vite, REDIS_URL=redis://redis y POSTGRES_HOST=postgres hacia el servicio compose, y los dockerfile: de rails y vite hacia docker/dockerfiles/*.Dockerfile. Sin rpc."



