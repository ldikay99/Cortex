notes = "route: anotaciones @GetMapping/@PostMapping/@PutMapping/@DeleteMapping de las interfaces Mgmt*RestApi (mgmt-api) y DdiRootControllerRestApi (ddi-api), con el handler en la clase que las implementa (MgmtXResource / DdiRootController); `from` = linea de la anotacion en la interfaz, `to` = `public ... metodo(` de la implementacion (symbol Clase.metodo); detail con la ruta completa resolviendo las constantes (MgmtRestConstants.REST_V1 = /rest/v1, CONTROLLER_V1 = /{tenant}/controller/v1, etc.). Cubre los 7 recursos Mgmt rollouts, autoassignments, targettags, targettypes, targetfilters, system (configs) y actions, mas los 16 endpoints DDI. Quedan fuera targets, distributionsets, distributionsettypes, distributionsettags, softwaremodules, softwaremoduletypes, targetgroups, basicauth y downloadartifact (Mgmt) por limite de volumen. http: llamadas Feign (HawkbitClient.mgmtService / ddiService crean proxies de las interfaces Mgmt*RestApi / DdiRootControllerRestApi) del UI Vaadin hawkbit-ui (hawkbitClient.getXxxRestApi().metodo(..) en views, TargetActionsHistory y los probes hasXxxRead de HawkbitMgmtClient) y del SDK (DdiController.getDdiApi().x, AuthenticationSetupHelper sobre MgmtTenantManagementRestApi) mas el HttpURLConnection de HawkbitUiApp.isAuthenticated a /rest/v1/rollouts -> handler de la implementacion; `from` = linea del nombre del metodo (en llamadas encadenadas en varias lineas es la linea del `.metodo(`). Solo se etiquetan llamadas a los 7 recursos Mgmt en scope y a DDI; las llamadas a las APIs de Target/DistributionSet/SoftwareModule (48 llamadas del UI/SDK, y ademas las de hawkbit-mcp, fuera de scope) se omiten porque sus rutas no estan etiquetadas como route. event: (1) eventos de aplicacion Spring: publishEvent(new XEvent(..)) en las entidades JPA y servicios (JpaAction, JpaRollout, JpaRolloutGroup, JpaRolloutExecutor, JpaTargetType/JpaDistributionSetType/JpaSoftwareModuleType/JpaSoftwareModule/JpaTenantConfiguration, JpaSystemManagement) -> cada metodo @EventListener que lo recibe (RolloutStatusCache x4, JpaTargetTypeManagement.evictByKeyCache, TenantAwareCacheManager.onCacheEvictEvent para los eventos que implementan CacheEvictEvent); (2) eventos que EventPublisherHolder envuelve en *ServiceEvent (TargetDeleted, TargetAssignDistributionSet, CancelTargetAssignment, TargetAttributesRequested): el productor publishEvent y la linea `return new XServiceEvent(..)` de toServiceEvent -> listeners de AmqpMessageDispatcherService; (3) registros @EventListener (annotation -> metodo, nota `subscription registration`); (4) spring-cloud-stream: streamBridge.send(fanoutEventChannel/serviceEventChannel) y los bindings `spring.cloud.stream.bindings.*EventConsumer-in-0.destination` de los application.properties de ddi/dmf/mgmt -> beans Consumer fanoutEventConsumer/serviceEventConsumer; (5) DMF/AMQP: DmfSender (SDK) rabbitTemplate.send -> @RabbitListener AmqpMessageHandlerService.onMessage (+ registro), DefaultAmqpMessageSenderService rabbitTemplate.send -> VHost.onMessage del SDK (+ container.setMessageListener). Omitidos: eventos publicados sin ningun @EventListener (TargetPollEvent, DownloadProgressEvent, *CreatedEvent de tags/DS/rollout, etc.), ApplicationListener de eventos del framework (ContextRefreshedEvent), el despacho dinamico de serviceEventConsumer/fanoutEventConsumer (publisher::publishEvent hacia listeners segun el tipo) y las llamadas amqpSenderService.sendMessage internas del dispatcher (no hay consumidor estatico mas alla de la cola). data: ORM modelo -> migracion Flyway: cada `@Table(name = \"sp_x\")` y cada @JoinTable/@CollectionTable (`name = \"sp_x\"`) de hawkbit-repository-jpa/.../model/*.java -> `CREATE TABLE sp_x` en db/migration/POSTGRESQL (baseline B1_20_0 o V1_20_3 para sp_auto_assignment); nota `model -> migration`. Solo se apunta a la variante POSTGRESQL (H2 y MYSQL son copias equivalentes); las migraciones ALTER posteriores no se etiquetan. Omitidos: consultas JPQL/Specification y los repositorios Spring Data (interfaces *Repository -> entidad), SP_LOCK (tabla de Spring Integration). env: (1) ENTRYPOINT de docker/build/Dockerfile y Dockerfile_dbinit que expande ${PROFILES}, ${X_MS}, ${X_MX}, ${XX_*}, ${XSS}, ${GC}, ${AND_THEN} -> su `ENV X=${X}`; ${PROFILES} y ${AND_THEN} ademas -> la linea `- 'PROFILES=postgresql'` / `'AND_THEN=sleep infinity'` de cada servicio de docker/postgres/*.yml que lo define; (2) HawkbitFlywayDbInit.prop(\"mode\"/\"url\"/\"username\"/\"password\") (lectura System.getenv con nombres relajados) -> HAWKBIT_DB_MODE / SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD del servicio hawkbit-db-init de los dos compose dbinit; (3) healthcheck `${POSTGRES_DB}`/`${POSTGRES_USER}` -> environment de postgres; (4) @Value(\"${hawkbit.events.remote.enabled:true}\") -> application.properties del monolito. Omitidos: ${JAVA_OPTS} (no se define en el repo), HAWKBIT_MDC_ACTOR_KEY, HAWKBIT_URL/HAWKBIT_USERNAME/HAWKBIT_PASSWORD del MCP, el resto de @Value/@ConfigurationProperties (propiedades sin definicion en .properties o con prefijo, resueltas por relaxed binding) y las variables SPRING_* de compose que no tienen lectura explicita en el codigo del repo. service: docker/postgres/*.yml (9 ficheros): `include:` -> fichero incluido (to a nivel de fichero, linea 1), depends_on -> servicio dependiente (resuelto por la cadena de include hasta docker-compose-deps-postgres.yml: postgres, rabbitmq), SPRING_RABBITMQ_HOST=rabbitmq y SPRING_DATASOURCE_URL=...postgres:5432 -> servicio de compose, hawkbit.server.mgmtUrl del hawkbit-ui (SPRING_APPLICATION_JSON) -> servicio hawkbit-mgmt / hawkbit; y los `COPY --from=build` de Dockerfile y Dockerfile_dbinit -> stage `FROM .. AS build`. Se omiten las variantes MySQL de docker/mysql (identicas con otro motor), Dockerfile_dev/Dockerfile_dbinit_dev y las referencias de modulos Maven (pom.xml). Exhaustividad: dentro del scope y los kinds declarados; ~21.7k LOC no-test aprox. (incluye licencias y SQL del baseline). Los fuentes de test no se etiquetan."


