[[repo]]
name = "quarkus-super-heroes"
split = "control2"
stack = "Quarkus multi-servicio: JAX-RS generado desde OpenAPI (RESTEasy Reactive), MicroProfile REST client + JAX-RS client, gRPC (Kotlin), Kafka (SmallRye Reactive Messaging), Panache Hibernate/Mongo, UI React (axios), docker compose"
url = "https://github.com/quarkusio/quarkus-super-heroes"
commit = "0d5a6a32dbfc387f52be407a8f5a515881c9cf00"
ref = "main"
scope = ["rest-heroes/src/main/", "rest-villains/src/main/", "rest-fights/src/main/", "rest-narration/src/main/", "event-statistics/src/main/", "grpc-locations/src/main/", "ui-super-heroes/src/main/", "deploy/docker-compose/java25.yml", "deploy/db-init/"]
kinds = ["route", "http", "rpc", "event", "data", "env", "service"]
notes = "route: las interfaces JAX-RS se generan en compilacion desde src/main/resources/openapi/openapi.yml, asi que 'from' es la linea del verbo en el openapi y 'to' el metodo que lo implementa (HeroResource, HelloHeroResource, ...); ademas UIResource GET /, EnvResource /env.js y los @WebSocket de event-statistics. http: interfaces @RegisterRestClient (HeroRestClient, NarrationClient) y WebTarget (VillainClient) de rest-fights, y axios de fight-service.js de la UI -> metodo implementador. rpc: servicio Locations del proto (y la copia del proto en rest-fights) y llamadas del LocationClient -> LocationGrpcService (Kotlin). event: canal Kafka 'fights' (MutinyEmitter de FightService -> @Incoming de SuperStats.processFight, mas configuracion del topic) y canales en memoria team-stats / winner-stats hacia los ChannelHolder de los WebSockets. data: servicios -> entidad Panache (Hero, Villain, Location, Fight en Mongo) y entidad -> import.sql / init de Mongo. env: propiedades quarkus.* de rest-fights con enlace relajado a las variables QUARKUS_* del compose, api.base.url de la UI. service: depends_on de los compose (global y por modulo) y direcciones de servicio en variables de entorno de rest-fights -> servicio destino. Solo se usa la variante java25 de los compose (native y k8s/helm quedan fuera)."

[[repo]]
name = "papermark"
