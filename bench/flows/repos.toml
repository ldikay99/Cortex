mandQueueManager.Push(new XCommand) en NzbDrone.Core y Radarr.Api.V3 (todas las llamadas Push(new ...)) -> IExecute<XCommand>.Execute, (3) ScheduledTask por defecto de TaskManager.Handle(ApplicationStartedEvent) (typeof(XCommand).FullName) -> Execute (nota scheduler registration), (4) difusion SignalR: BroadcastResourceChange del controlador -> handleXxx de SignalRConnector (el nombre del mensaje es el recurso; getHandlerName aplica titleCase y quita /), mas SendAsync(\"receiveMessage\") -> connection.on('receiveMessage') y el ModelEvent<TModel> generico de BasicRepository -> RestControllerWithSignalR.Handle. Omitidos: MovieGrabbedEvent, DownloadCompletedEvent, MoviesDeletedEvent, QueueUpdatedEvent y los demas eventos de dominio; el Push dinamico de CommandController.StartCommand. data: (a) Mapper.Entity<X>(\"Tabla\") de TableMapping.cs -> clase del modelo, (b) clase del modelo -> Create.TableForModel de la migracion (nota model -> migration; Blocklist se creo como Blacklist, ReleaseProfiles como Restrictions y QualityProfiles como Profiles y se renombran en migraciones posteriores; las tablas del scope son Tags, RootFolders, Blocklist, CustomFilters, DelayProfiles, RemotePathMappings, ImportExclusions, ReleaseProfiles, AutoTagging, History, QualityDefinitions, ScheduledTasks y Commands), (c) SQL crudo de los housekeepers (mapper.Execute DELETE FROM/UPDATE de la primera tabla) -> migracion que crea esa tabla (MovieTranslations se crea con SQL CREATE TABLE por motor en 177_language_improvements). Los repositorios BasicRepository<T> y las consultas Dapper por expresion no se etiquetan. env: lecturas _xOptions.Prop de ConfigFileProvider (App, Auth, Server, Log, Update, Postgres) -> propiedad de la clase Options correspondiente (la variable es RADARR__<SECCION>__<CLAVE> via ConfigurationBuilder.AddEnvironmentVariables, tambien config.xml), RADARR__LOG__CONSOLEFORMAT de NzbDroneLogger -> LogOptions.ConsoleFormat, PostgresOptions.GetOptions -> PostgresOptions y Radarr:Server:BindAddress de Bootstrap. Sin definicion en el repo (omitidas): THREAD_LIMIT, MAX_PATH, MAX_NAME, INVOCATION_ID, DOTNET_RUNNING_IN_CONTAINER. service: services.Configure<XOptions>(config.GetSection(\"Radarr:...\")) de Bootstrap (dos bloques: RunUtilityMode y CreateConsoleHostBuilder) -> clase Options, ProjectReference entre los .csproj (Host, Api.V3, Http, Core, SignalR, Console), lista Bootstrap.ASSEMBLIES -> proyecto y AddApplicationPart de Startup -> proyecto. No hay docker-compose ni Dockerfile en el repo."


