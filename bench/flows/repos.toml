notes = "route: bloque Route::prefix('pixelfed') de routes/web-api.php (/api/pixelfed/v1, /api/pixelfed/v2 y las dos rutas sueltas discover/accounts/popular y web/change-language.json; prefijo /api del grupo exterior), mas de routes/api.php solo api/landing/v1/directory, api/v1.1/discover/* (4), api/v1.1/auth/* (7, incluidas las de invite/admin) y las dos rutas api/pixelfed/v1/web/settings (GET/POST; el resto del bloque api/pixelfed de api.php duplica URLs ya declaradas en web-api.php y queda fuera), mas la ruta api/v1.1/auth/invite/admin/re de routes/web.php. Cada Route::verb('x', [Controller::class, 'metodo']) -> `function metodo(` del controlador; si el metodo es heredado (ApiController extends Api/BaseApiController) se resuelve a la clase padre. Fuera de scope: el resto de web-api.php (api/compose, api/direct, api/local, api/web/stories, api/portfolio, api/v2 sin pixelfed, polls), api.php (Mastodon api/v1, v2, v1.1 accounts/collections/direct/stories..., v1.2, admin, groups v0, live comentado), web.php y web-admin.php. http: llamadas axios.<verbo>(url) en resources/assets/components/** (SPA nueva) y resources/assets/js/*.js cuyo URL (con concatenaciones y template literals normalizados a {id}) empieza por /api/pixelfed, /api/v1.1/ o /api/landing; se resuelven a la primera ruta declarada coincidente (orden de declaracion de Laravel: p. ej. accounts/verify_credentials antes que accounts/{id}) y la nota indica el URL y la ruta. Ademas el form action '/api/v1.1/auth/invite/admin/re' de AdminInvite.vue -> routes/web.php (nota HTML form action). Omitidos: resources/assets/js/components/** (componentes legado) y llamadas comentadas; llamadas de components a otros prefijos (/api/v1, /api/v2, /api/compose, /api/local, /api/web, /i/...) por estar fuera del scope de rutas. event: cada X::dispatch/dispatchSync de una clase en App\\Jobs en ApiV1Controller, BaseApiController, AccountController e InternalApiController -> `function handle` del job (nota job dispatch / job dispatchSync), y los Event::listen(Evento::class, Listener::class) de AppServiceProvider -> Listener::handle (nota subscription registration; AuthLogin y LogFailedLogin). Omitidos los dispatch del resto de controladores, servicios, jobs encadenados y observers, y los eventos de framework que se disparan sin Event::dispatch visible. data: modelo Eloquent (28 de app/Models: Status, Profile, Follower, FollowRequest, Like, Media, Notification, Bookmark, Hashtag, StatusHashtag, Mention, Newsroom, Collection, CollectionItem, DirectMessage, Conversation, Instance, Report, Avatar, StatusArchived, UserAppSettings, Place, Poll, PollVote, Portfolio, MediaTag, HashtagFollow, ImportPost) -> migracion con el unico Schema::create de su tabla (nota model -> migration). Omitidos Story/StoryView (tabla creada en varias migraciones, ambiguo), los otros ~80 modelos (Group*, Dm*, CustomFilter*, etc.) y el uso de tablas por DB::table en controladores. env: primera lectura env('VAR') por variable en config/app.php, config/database.php, config/queue.php, config/session.php y config/pixelfed.php de variables definidas en .env.example (tambien comentadas `#VAR=`) -> linea del .env.example; mas las interpolaciones ${DB_DATABASE}, ${DB_USERNAME}, ${DB_PASSWORD} de docker-compose.yml -> .env.example (nota docker-compose interpolation). Variables sin definicion en .env.example (p. ej. DB_ROOT_PASSWORD) se omiten, igual que el resto de config/ (mail, cache, filesystems, horizon...). service: depends_on (db, redis) de pixelfed, horizon y scheduler en docker-compose.yml -> bloque del servicio; build.dockerfile de los tres servicios -> ultima etapa FROM del Dockerfile; COPY --from=vips/ffmpeg del Dockerfile -> la etapa FROM ... AS vips/ffmpeg (multi-stage). docker-compose.test.yml no tiene cableado. Sin rpc."


