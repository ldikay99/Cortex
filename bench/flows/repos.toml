notes = "route: los cuatro urls.py de apps/api/plane/app/urls (state, estimate, cycle, module; montados bajo path('api/', include('plane.app.urls')) en plane/urls.py, por eso detail lleva el prefijo /api/ y <uuid:x>/<str:slug> pasan a {x}). Cada path(...) con X.as_view({'get': 'list', ...}) da una etiqueta por verbo/accion -> `def accion` de la clase en app/views/{state,estimate,cycle,module}/ (nota ViewSet.as_view action mapping); X.as_view() de APIView da una etiqueta por cada metodo get/post/put/patch/delete definido en la clase (nota APIView verb method). from.line = linea de la cadena de ruta. Se omiten las acciones sin `def` en el repo porque vienen heredadas de DRF ModelViewSet via BaseViewSet (CycleViewSet.update PUT, CycleIssueViewSet retrieve/update/partial_update, CycleFavoriteViewSet.list, ModuleViewSet.update PUT, ModuleIssueViewSet retrieve/update/partial_update, ModuleLinkViewSet list/create/retrieve/update/partial_update/destroy, ModuleFavoriteViewSet.list, StateViewSet.retrieve). http: llamadas this.get/post/put/patch/delete(`/api/...`) de las clases APIService (axios) listadas en scope; la plantilla `${x}` se normaliza a {x} y se casa por verbo+ruta (sin barra final ni query) contra TODOS los path() de app/urls, y la etiqueta apunta al handler final (mismo `def` que la etiqueta route). from.line = linea de `this.verb(`. Se omiten: llamadas sin ruta servida en el repo (cycle-progress/ y active-cycles/ no tienen ruta declarada en el repo, probablemente EE; PUT states/{id} no esta enrutado, solo patch), llamadas cuya accion es heredada de DRF (module-links, states retrieve, PUT modules), la rama comentada de packages module.service.ts y los servicios sites-*.service.ts (API publica de space, fuera de scope), asi como el resto de clientes de apps/web (otros servicios, componentes) y packages/services (cycle-analytics/archive/operations, module link/operations duplican las mismas URLs). event: cada `X.delay(` / `X.apply_async(` en app/views/{state,estimate,cycle,module}, utils/cycle_transfer_issues.py y bgtasks/*.py -> `def` de la funcion @shared_task (issue_activity, model_activity, recent_visited_task, notifications, send_email_notification, webhook_activity, webhook_send_task, send_webhook_deactivation_email, sync_issue_version, sync_issue_description_version, ...); y cada entrada `\"task\": \"plane...\"` de app.conf.beat_schedule en celery.py -> def de la tarea (nota subscription registration). from.symbol es la funcion envolvente. Quedan fuera .delay de otros sitios (db/mixins.py soft_delete_related_objects, management commands, resto de views/signals) y llamadas por send_task/nombre dinamico. data: (1) modelo ORM -> CreateModel de la migracion que lo crea, para los 11 modelos de db/models/{state,estimate,cycle,module}.py con tabla (State, Estimate, EstimatePoint, Cycle, CycleIssue, CycleUserProperties, Module, ModuleMember, ModuleIssue, ModuleLink, ModuleUserProperties; to = linea de `migrations.CreateModel(`; nota model -> migration); (2) por cada archivo de views en scope y por cada uno de esos modelos usados (X.objects/all_objects/issue_objects o constructor X(...)), una etiqueta desde la primera linea de uso en el archivo -> `class X` del modelo (nota model usage). No se etiquetan usos de otros modelos (Issue, Project, UserFavorite, ...) ni serializers ni raw SQL. env: os.environ.get('VAR') en settings/storage.py, settings/local.py, settings/production.py y celery.py cuya variable esta definida en apps/api/.env.example (to = linea VAR=) y las interpolaciones ${VAR} de docker-compose.yml -> .env.example de la raiz. Se omiten las variables sin definicion en .env.example/Dockerfile (p. ej. EMAIL_BACKEND, SCOUT_*, METRICS_PUSH_INTERVAL_MINUTES) y settings/common.py (63 lecturas) por tamano. service: cada entrada de depends_on de docker-compose.yml -> bloque del servicio destino; build.dockerfile -> Dockerfile (linea 1); `command: ./bin/docker-entrypoint-*.sh` -> script (linea 1); y CMD de apps/api/Dockerfile.api -> docker-entrypoint-api.sh. env_file ./apps/api/.env no existe en el repo (solo .env.example) y se omite. Los tests, apps/api/tests y plane/tests no se etiquetan."


