notes = "route: atributos [HttpGet/Post/Put/Delete] + [Route(..)] de los seis controladores TeamsController, TeamContributorsController, RulesController, SchemasController, SchemaFieldsController y SchemaIndexesController (la linea `from` es la del verbo [HttpX], `to` la firma `public ... Metodo(` del handler, symbol Clase.Metodo); detail lleva la ruta completa con el prefijo /api de ApiController ([Route(Constants.PrefixApi)]) y sin la barra final, y las restricciones de ruta ({id:long}) se normalizan a {id}. Una etiqueta por verbo; los controladores son clases normales (sin resourceful expansion). Quedan fuera SchemaContentsController, Apps, Assets, Contents y el resto de controladores. http: llamadas Angular con URL explicita construida con ApiUrlConfig.buildUrl(`api/...`) seguida de this.http.get/post/put/delete o de los helpers HTTP.getVersioned/postVersioned/putVersioned/deleteVersioned en teams.service.ts, features/teams/services/team-contributors.service.ts, rules.service.ts, schemas.service.ts e indexes.service.ts -> handler del controlador (ruta con mas segmentos literales gana en caso de comodines). La mayoria de operaciones de actualizacion/borrado usan enlaces HATEOAS (`buildUrl(link.href)` + this.http.request(link.method, ..)): son dinamicas y se omiten; tampoco se etiqueta schemas.service getPreviewUrlsCompletion (`completion/preview-urls`) porque el servidor declara la ruta con la errata `completion/prview-urls`, asi que no hay handler que coincida. Se omiten teams plans/usages/history y apps.service /teams/{id}/apps (controladores fuera de scope). event: (1) eventos de dominio de Rules y Teams: cada `Raise(command, new XEvent())`/`RaiseInitial(new XEvent())` de RuleDomainObject y TeamDomainObject (y los productores de RuleManuallyTriggered en RuleDomainObject y DefaultRuleRunnerService y de RuleCronJobTriggered en CronJobUpdater) -> cada consumidor que lo trata por tipo: Apply del snapshot (RuleDomainObject.State / TeamDomainObject.State), CronJobUpdater.On, BackupRules.RestoreEventAsync, ManualTriggerHandler y CronJobTriggerHandler (Handles + CreateEnrichedEventsAsync), TeamHistoryEventsCreator.CreateEvent, InvitationEventConsumer.On y NotifoService.HandleEventsAsync (`to` apunta a la firma del metodo, una etiqueta por consumidor y por productor); los consumidores genericos de todos los eventos (RuleEnqueuer, HistoryService, EventConsumerProcessor, etc.) no se etiquetan por evento sino solo por su registro; (2) `cronJobs.Subscribe(HandleCronJobAsync)` -> HandleCronJobAsync (nota subscription registration); (3) registros `AddSingletonAs<X>().As<IEventConsumer>()` / AddTransientAs en los Config/Domain y Messaging indicados y en Squidex.Data.MongoDb/ServiceExtensions -> metodo `Task On(` de la clase (nota subscription registration), y los `As<IRuleTriggerHandler>()` de RuleServices -> `Handles(` del handler. Se omiten el EF/ServiceExtensions (no registra consumidores), el dispatch por commandBus (InvokeCommandAsync / DomainObject.ExecuteAsync resuelto por tipo de comando en tiempo de ejecucion), el flow manager/colas de mensajeria y los eventos de Schemas y Apps. data: (1) entidad EF Core de snapshot (EFRuleEntity, EFSchemaEntity, EFTeamEntity) -> `CreateTable name: \"States_Rule/Schema/Team\"` de la migracion Initial de Postgres (nota model -> migration); solo Postgres; las migraciones equivalentes de MySql y SqlServer no se etiquetan; AppDbContext `builder.UseX(` -> EFXBuilder.UseX y `UseSnapshot<..>` -> entidad (nota model registration); (2) cada `dbContext.Set<EFXEntity>()` de EFRuleRepository, EFTeamRepository y EFSchemaRepository -> clase de la entidad (nota repository query -> entity); (3) acceso `Collection.Find/DeleteMany/...` y `collection.Indexes` de MongoRuleRepository, MongoTeamRepository y MongoSchemaRepository -> clase MongoXEntity (nota mongo collection access -> entity; la coleccion States_Rules/States_Teams/States_Schemas se indica en detail). Las colecciones MongoDB no tienen migracion/esquema (las migraciones de datos en backend/src/Migrations no se etiquetan) y no se etiqueta MongoSchemasHash ni las tablas RuleEvents/CronJobs. env: Squidex lee configuracion .NET (claves `a:b:c`, mapeadas a variables A__B__C) y no usa Environment.GetEnvironmentVariable; se etiqueta cada lectura de clave en StoreServices, EventSourcingServices, RuleServices, SchemasServices, Squidex.Data.EntityFramework/ServiceExtensions y Squidex.Data.MongoDb/ServiceExtensions (ConfigureByOption/GetValue/GetRequiredValue/GetOptionalValue/Configure<T>(section)) -> la linea de la clave por defecto en appsettings.json (recorrido por ruta de clave sin distinguir mayusculas) y, si existe, cada `- VAR=valor` en tools/TestSuite/docker-compose-base.yml, docker-compose.yml y docker-compose-postgres.yml; ademas las variables DOMAIN y MONGO del script packer/render/squidex/squidex.sh -> envVars de render.yaml. Se omiten las lecturas dinamicas de Mongo (`{prefix}:configuration`, `{prefix}:certificate`, shardCount por nombre), la segunda lectura de store:mongoDb:atlas (Configure<AtlasOptions>), y las claves de AppsServices/AssetServices/CollaborationServices/ContentsServices/HistoryServices/MessagingServices (solo se etiquetan sus registros de eventos) y los compose de mysql, sqlserver, ferretdb y helm. service: docker-compose de TestSuite (base, mongo y postgres): `extends service: squidex_base` -> squidex_base, depends_on, SITE_SERVER=\\\"servicio:5000\\\" de los proxies, host en STORE__SQL__CONNECTIONSTRING y mongodb://db_mongo del base -> servicio compose; Dockerfile: COPY --from=backend/frontend -> etapas FROM, dotnet publish y ENTRYPOINT -> Squidex.csproj, COPY slnx y package*.json, DIAGNOSTICS__DUMPTOOL -> dotnet tool install; los doce ProjectReference de Squidex.csproj -> csproj destino (linea 1); render.yaml dockerfilePath y fromService squidex_mongo; packer/render/squidex y packer/heroku/squidex Dockerfile ADD/ENTRYPOINT -> squidex.sh; heroku.yml -> Dockerfile. Se omiten helm/, packer/render/mongo, tools/TestSuite compose de mysql/sqlserver/ferretdb y docker-compose.yml de EF. Sin rpc."


[[repo]]
name = "svix-webhooks"
split = "control6"
stack = "Rust (axum + aide ApiRouter, rutas por modulo v1/endpoints/*::router) + SeaORM (entidades en db/models) con migraciones sqlx (server/svix-server/migrations) + cola de tareas omniqueue (redis/rabbitmq/memory) con productores en handlers y worker propio (queue_handler) + config figment (config.default.toml + env SVIX_*) + docker-compose / Dockerfile en server/ (sin frontend)"
url = "https://github.com/svix/svix-webhooks"
commit = "f7a6325543ae30d5ac2f71b1a9afffaa80836623"
ref = "main (tag cercano: server-v1.102.0)"
scope = ["server/svix-server/src/", "server/svix-server/migrations/", "server/svix-server/config.default.toml", "server/svix-server/development.env", "server/svix-server/build.rs", "server/svix-server/Cargo.toml", "server/Cargo.toml", "server/Dockerfile", "server/docker-compose.yml", "server/docker-compose.override.yml", "server/testing-docker-compose.yml", "server/scripts/launch-svix-server"]
kinds = ["route", "event", "data", "env", "service"]
notes = "Solo server/ (los SDK/librerias de lenguaje son clientes generados y no se etiquetan; no hay frontend, por lo que no hay kind http ni rpc). route: todos los api_route / api_route_with / route de los routers de v1/endpoints (health, auth, application, endpoint/{mod,crud,secrets,headers,recovery}, event_type, message, attempt, admin) -> `fn` handler, una etiqueta por verbo (from = linea del `get_with/post_with/.put_with(...)` o del `axum::routing::get(..)` para las rutas deprecadas que se registran con .route y no entran en OpenAPI); detail lleva la ruta completa con el prefijo /api/v1 de `nest_api_service(\"/api/v1\", v1_router)` en lib.rs; mas /development/echo (GET/POST, solo con debug_assertions) y las rutas de docs en lib.rs (GET /, /docs, /api/v1/openapi.json). Se omiten los `_operation` (transformadores OpenAPI). event: productores de QueueTask (create_message -> MessageBatch; resend_webhook, recover_failed_webhooks y el reintento de handle_failed_dispatch -> MessageV1; health -> HealthCheck) -> brazo del match en process_queue_task_inner de worker.rs; registro del consumidor (lib.rs -> queue_handler, nota subscription registration) y el bucle receive_all -> process_queue_task; admin redrive_dlq -> SvixOmniProducer::redrive_dlq; y los 8 send_operational_webhook (worker, crud, secrets) -> OperationalWebhookSenderInner::send_operational_webhook (el consumidor real es un servidor Svix externo via SDK, no se etiqueta). El dispatcher concreto de backend (redis/rabbitmq/memory) dentro de omniqueue es dinamico y no se etiqueta. data: (1) modelo SeaORM `pub struct Model` de los 9 db/models -> CREATE TABLE en la migracion que lo define; (2) cada uso `<modelo>::Entity` o `<modelo>::ActiveModel` en codigo no-test de v1/endpoints, worker.rs, core/message_app.rs, core/permissions.rs y db/mod.rs (prune/wipe) -> `pub struct Model` del modelo (una etiqueta por linea y tabla; ActiveModel construido/convertido marcado como write); (3) SQL crudo de expired_message_cleaner.rs -> migracion que crea message/messagecontent. Se omiten tests, los tipos que solo mencionan ActiveModel en firmas/alias (type ActiveModel, update_model, campos de struct), la tabla interna _svix_background_migrations (se crea por SQL en background_migrations.rs, no hay migracion sqlx) y los usos de ::Column/::Model que acompanan a una consulta ya etiquetada. env: cada campo de ConfigurationInner (y ProxyConfig, JwtSigningConfig/JWTAlgorithm) con clave en config.default.toml (activa o comentada) -> esa linea del toml (variable SVIX_<CLAVE> via Env::prefixed); ademas el valor concreto en development.env, docker-compose.yml y docker-compose.override.yml (SVIX_REDIS_DSN, SVIX_DB_DSN, SVIX_JWT_SECRET, SVIX_CACHE_TYPE, SVIX_LOG_LEVEL, SVIX_QUEUE_TYPE, SVIX_RABBIT_DSN), DATABASE_URL -> development.env, WAIT_FOR del script launch -> compose, WRITE_EXECUTABLE_METADATA de build.rs -> ARG del Dockerfile. Se omiten campos sin definicion en ningun archivo (rabbit_dsn aparte de development.env, rabbit_consumer_prefetch_size, redis_pending_duration_secs, enable_redis_v1_v2_queue_migration, region, app_portal_url, campos de SentinelConfig), RUST_LOG, GITHUB_SHA y RUN_MIGRATIONS (no definidos en el repo). service: depends_on del compose (backend->pgbouncer/redis, pgbouncer->postgres, redis-cluster->nodos), host de SVIX_DB_DSN/SVIX_REDIS_DSN/DB_HOST -> servicio compose, overrides de docker-compose.override.yml, build/dockerfile, COPY/CMD del Dockerfile y exec del script launch -> binario svix-server, healthcheck -> subcomando healthcheck de main.rs, miembros del workspace Cargo y dependencia path svix-server-derive, montaje de rabbit/enabled_plugins, sqlx::migrate!() -> directorio de migraciones, seleccion de backend de cola (new_pair), tareas en proceso (cleaner, background migrations) y los .merge de v1::router -> router de cada modulo. El plugin binario .ez de rabbit no se etiqueta."
