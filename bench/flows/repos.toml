notes = "route: los 9 controladores Nest listados (sets, signatures, webhooks, notifications, settings, autopost, posts, analytics, announcements): cada decorador @Get/@Post/@Put/@Delete -> primera firma de metodo de la clase tras el decorador (el decorador de la linea es el `from`); detail con la ruta completa @Controller + subruta, sin prefijo global (el backend no usa setGlobalPrefix; el `/api` lo pone el frontend via NEXT_PUBLIC_BACKEND_URL y nginx lo quita). Se omiten el resto de controladores de apps/backend/src/api/routes (users, integrations, media, billing, copilot, auth, public, etc.), el controlador de la API publica apps/backend/src/public-api (auth por API key, lo consumen el SDK y la extension, no este frontend) y el controlador de salud del orquestador. http: cada `fetch(...)` de la instancia useFetch() (libraries/helpers/src/utils/custom.fetch.tsx; la base es NEXT_PUBLIC_BACKEND_URL=/api y nginx hace proxy_pass quitando /api) en apps/frontend/src/components con URL literal o plantilla `${id}` hacia esos 9 controladores -> metodo del controlador; los ternarios de metodo/URL (autopost, signatures, webhooks, tags) generan una etiqueta por rama; los fetch que viven dentro de callbacks de useSWR se etiquetan en la linea del fetch. Se omiten: /analytics, /analytics/trending y /analytics/stars (SWR con `path` dinamico, sin controlador propio), /settings/github, /settings/repository y /settings/organizations (el controlador ya no las define), `/public/posts/{id}/comments` (rama anonima de comments.components.tsx; PublicController fuera de scope), los usos de /posts/generator/draft y PUT /sets (el frontend no los llama), y las llamadas a otros controladores (integrations, auth, media...). event: Temporal (no hay cola BullMQ). Productor -> funcion de workflow exportada: workflow.start(name)/signalWithStart(name)/executeChild/startChild en autopost.service, clipping.service, media.service (2), notification.service, posts.service, refresh.integration.service, email.service, infinite.workflow.register, post.activity (signalWithStart postWorkflowV112, start streakWorkflowV2), clipping.workflow (executeChild) y el startChild de cada una de las 12 versiones de postWorkflow (se reinicia a si misma); ademas las dos senales (`email` -> setHandler(emailSignal) y `poke` -> setHandler(poke) de v1.1.2, nota Temporal signal handler). Se omiten: las llamadas workflow -> activity (proxyActivities, dinamicas por destructuring), el registro de workflows por `export *` de workflows/index.ts, los nombres de workflow construidos dinamicamente y las versiones antiguas de postWorkflow como destino de arranque (el productor actual solo arranca V112). data: toda lectura/escritura `this._x.model.<modelo>.<op>(` de los repositorios sets, signatures, webhooks, notifications (incluye user), autopost y announcements -> `model X {` de schema.prisma (no hay migraciones; el despliegue usa prisma db push); no se etiqueta posts.repository.ts (51 usos) ni el resto de repositorios. env: primera lectura de cada process.env.VAR por archivo en backend main.ts/app.module.ts, orchestrator main.ts/health.controller.ts/post.activity.ts, temporal/{temporal.module,temporal.register,infinite.workflow.register}.ts, email.service.ts y autopost.service.ts, mas env(\"DATABASE_URL\") de schema.prisma -> linea de .env.example (tambien comentadas `#VAR=`) y, si no esta alli, la linea `VAR:` del servicio postiz de docker-compose.yaml; las variables sin definicion en ninguno de los dos (TZ, PORT, ORCHESTRATOR_PORT, TEMPORAL_TLS/API_KEY/NAMESPACE, EXCLUDE_QUEUE, WORKER_CONCURRENCY_DIVIDER, RUN_CRON, EMAIL_PROVIDER) se omiten. service: docker-compose.yaml y docker-compose.dev.yaml: depends_on / links entre servicios (postiz -> postiz-postgres y postiz-redis, redisinsight -> redis, temporal -> temporal-postgresql y temporal-elasticsearch, admin-tools -> temporal), URLs de servicio en env (DATABASE_URL, REDIS_URL, TEMPORAL_ADDRESS, POSTGRES_SEEDS, ES_SEEDS) -> bloque del servicio compose, DYNAMIC_CONFIG_FILE_PATH -> dynamicconfig/development-sql.yaml; Dockerfile.dev COPY nginx.conf y CMD pnpm run pm2 -> script de package.json; nginx proxy_pass :3000 -> main.ts del backend y :4200 -> script start del frontend; apps/orchestrator app.module getTemporalModule -> temporal.module.ts. Sin rpc (no hay gRPC)."


