name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta existente a publicar (por ejemplo v1.1.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  dist:
    name: Paquete Python (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
          enable-cache: false
      - name: La versión del paquete coincide con la etiqueta
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('analyzer/pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$TAG" || { echo "pyproject dice $version pero la etiqueta es $TAG"; exit 1; }
      - run: uv build analyzer --out-dir dist
      - name: El wheel instala y arranca
        run: uv run --no-project --with dist/*.whl cortex --version
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: Release en GitHub
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      - name: Crea o actualiza la release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Córtex $TAG" --generate-notes --verify-tag
          fi

  images:
    name: Imagen ${{ matrix.image }} (amd64 + arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cortex-analyzer
            context: analyzer
            title: Córtex analyzer
            description: Analizador determinista de Córtex que convierte un repositorio en un grafo de conocimiento, con CLI, API HTTP y servidor MCP.
          - image: cortex-web
            context: .
            title: Córtex web
            description: Web de Córtex que teje el grafo de conocimiento de un repositorio como un universo 3D.
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Nombre de la imagen
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4.3.0
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

  pypi:
    name: PyPI (trusted publishing)
    needs: dist
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cortex-graph/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
